[package]
name = "skrape-library"
version = "0.3.0"
description = "Browse everything you have skraped"
edition = "2021"
license = "MIT"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
rusqlite = { version = "0.32", features = ["bundled"] }
serde_json = "1"
unicode-normalization = "0.1"
regex = "1"
percent-encoding = "2"

[profile.release]
strip = true
lto = true
